name: Build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-latest
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pas de binaire node-pty précompilé pour Linux : npm ci le compile (N-API, compatible Electron).
      - run: npm ci
      - name: Vérifications
        run: |
          node --check server.js
          node --check electron/main.js
          node --check public/app.js
      - name: Tests
        run: npm test
      - name: Empaquetage
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist.noindex/*.exe
            dist.noindex/*.dmg
            dist.noindex/*.AppImage
            dist.noindex/*.deb
            dist.noindex/*.blockmap
            dist.noindex/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Free Session Manager ${{ github.ref_name }}
          files: dist/*
